[project]
name = "engano-gmail"
version = "0.1.0"
description = "ENGANO Gmail adapter: review inbox over IMAP, threaded replies over SMTP"
requires-python = ">=3.11"
# Uses the shared review service in Backend/ (engano_backend) and ai_engine from
# the repo root, so it is installed into the root .venv (`make setup`).
dependencies = []  # standard library only (imaplib, smtplib, email)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engano_gmail"]
