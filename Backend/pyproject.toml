[project]
name = "engano-backend"
version = "0.1.0"
description = "ENGANO FastAPI backend: review service and channel webhooks"
requires-python = ">=3.11"
# Imports ai_engine from the repo root, so it is installed into the root .venv
# (`make setup`) and run from the root (`make backend`).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engano_backend"]
