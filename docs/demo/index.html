<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGANO demo</title>
<style>
  :root { --bg:#0b0b0e; --panel:#15151b; --line:#2a2a33; --text:#f1f1f5; --muted:#9d9dad; --accent:#8b5cf6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .switch { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .switch button { padding:10px 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); }
  .switch button[aria-pressed=true] { border-color: var(--accent); background:#1d1730; }
  video { width:100%; border-radius:14px; background:#000; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns: 1fr; gap: 24px; margin-top: 24px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 280px 1fr; } }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .chapters button { width:100%; text-align:left; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
  .chapters button:hover, .chapters button.on { border-color: var(--accent); background:#1d1730; }
  .t { display:inline-block; min-width:3.2em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .transcript p { margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; border-left: 3px solid transparent; }
  .transcript p.on { background: var(--panel); border-left-color: var(--accent); }
  .transcript button { border:0; background:none; color: var(--accent); padding:0 6px 0 0; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>ENGANO demo</h1>
  <p class="sub" id="blurb"></p>
  <div class="switch" id="switch" role="group" aria-label="Choose a video"></div>
  <video id="v" controls preload="metadata"></video>
  <div class="grid">
    <nav class="chapters" aria-label="Chapters"><h2>Chapters</h2><ul id="chapters"></ul></nav>
    <section class="transcript" aria-label="Transcript"><h2>Transcript</h2><div id="transcript"></div></section>
  </div>
</main>
<script>
  const VIDEOS = [{"key": "main", "title": "Product walkthrough", "blurb": "A brand manager sets up, a creator drafts, a reviewer decides, the manager watches. Real recording of the running app.", "video": "engano-demo.mp4", "poster": "engano-demo.jpg", "duration": 204.9, "chapters": [{"title": "Intro", "start": 0.0}, {"title": "The problem", "start": 11.46}, {"title": "Brand manager sets up", "start": 24.72}, {"title": "Creator drafts", "start": 51.8}, {"title": "Images", "start": 89.68}, {"title": "Website check", "start": 100.4}, {"title": "Reviewer decides", "start": 123.31}, {"title": "Fix and resubmit", "start": 154.35}, {"title": "Manager overview", "start": 172.95}, {"title": "Where it stands", "start": 187.87}], "captions": [{"start": 0.5, "end": 10.4, "text": "ENGANO checks content against a brand's own rules before anything is published. It explains every problem, cites where the rule came from, and leaves the decision to people."}, {"start": 12.0, "end": 23.6, "text": "Employees, agencies and AI tools publish fast. Wrong facts, retired offers, off-brand tone and unreadable visuals slip out before anyone notices. ENGANO is the check that happens first."}, {"start": 24.9, "end": 30.1, "text": "A brand manager signs up and creates a brand. Creators choose a brand to write for."}, {"start": 30.6, "end": 33.2, "text": "Each workspace gets its own join code."}, {"start": 33.6, "end": 40.4, "text": "And its own rules. Here the manager writes a don't: never use the word cheap. ENGANO enforces it exactly."}, {"start": 40.8, "end": 46.8, "text": "Reviewers can't sign themselves up. The manager creates their account, and ENGANO generates the password."}, {"start": 47.5, "end": 50.8, "text": "The manager can also post an assignment with a deadline."}, {"start": 52.0, "end": 56.7, "text": "A creator signs up, then joins the workspace with the code the manager shared."}, {"start": 57.2, "end": 63.4, "text": "The studio is where drafts are checked. This one has a banned word, a wrong fact and a retired offer."}, {"start": 63.6, "end": 71.5, "text": "Specialised agents run at once: terminology, claims, tone, legal and accessibility. Problems are underlined in place."}, {"start": 72.2, "end": 78.2, "text": "Every finding names the rule or approved fact behind it. The manager's own rule is enforced here too."}, {"start": 78.4, "end": 83.3, "text": "Fixes are suggestions the creator accepts. Nothing is changed behind their back."}, {"start": 83.6, "end": 88.5, "text": "Problems remain, so this draft can't clear itself. It goes to a human reviewer."}, {"start": 89.9, "end": 99.2, "text": "Images are checked too. ENGANO reads the text in the picture, measures real contrast from the pixels, and notices when there is no description for screen readers."}, {"start": 100.6, "end": 114.4, "text": "A creator can paste a website address. ENGANO opens it in a real browser, scrolls the whole page and back, tests the links, tries a phone-sized screen and measures accessibility. This takes about a minute, so we skip ahead."}, {"start": 114.4, "end": 122.9, "text": "Where ENGANO can't see the site, or something is broken, it says what is wrong and what the site's owner must fix. It doesn't just suggest small edits."}, {"start": 123.5, "end": 129.0, "text": "The reviewer signs in with the account the manager created, and sees only their workspace's queue."}, {"start": 129.3, "end": 134.5, "text": "Each draft arrives with ENGANO's findings, their sources and suggested corrections."}, {"start": 134.8, "end": 142.8, "text": "History keeps every version and shows what changed. Comments let the reviewer, the creator and the manager talk about the draft in one place."}, {"start": 143.0, "end": 146.7, "text": "They approve, or reject with a note the creator can act on."}, {"start": 146.9, "end": 153.1, "text": "A reviewer can add a WhatsApp number or Discord ID in settings, and review requests arrive there too."}, {"start": 154.6, "end": 158.7, "text": "The creator sees the reviewer's note, fixes the draft and resubmits."}, {"start": 159.3, "end": 164.1, "text": "This time nothing is left to fix. ENGANO clears it without bothering a reviewer."}, {"start": 164.4, "end": 171.4, "text": "Version one is never lost. Version two highlights exactly what changed, and the timeline shows who did what and when."}, {"start": 173.2, "end": 183.1, "text": "The manager never reviews drafts. They watch the whole picture: where content stands, who sends what, what reviewers decided, and which problems keep repeating."}, {"start": 183.6, "end": 186.6, "text": "And every approved draft is here, read only."}, {"start": 188.4, "end": 203.8, "text": "That is the working product: three roles, a multi-agent review engine, image and website checks, history and comments on every draft, and its data in Supabase. Still to build: a brand library, document import, and a policy for each brand."}]}, {"key": "dev", "title": "Example: website work for a developer", "blurb": "A manager assigns website work to a developer. ENGANO checks the page, a reviewer verifies it.", "video": "engano-demo-dev.mp4", "poster": "engano-demo-dev.jpg", "duration": 102.4, "chapters": [{"title": "Intro", "start": 0.0}, {"title": "Manager assigns the work", "start": 10.88}, {"title": "Developer checks the page", "start": 29.44}, {"title": "Fix and check again", "start": 60.22}, {"title": "Reviewer verifies", "start": 76.93}, {"title": "Developer sees it approved", "start": 92.29}, {"title": "Manager's view", "start": 95.73}], "captions": [{"start": 0.5, "end": 9.8, "text": "Not every deliverable is text. Here a brand manager assigns work on a website to a developer, and ENGANO helps check the result before a reviewer signs it off."}, {"start": 11.1, "end": 15.4, "text": "The brand manager signs up and creates a workspace for the web team."}, {"start": 15.8, "end": 20.4, "text": "The manager creates the reviewer's account. ENGANO generates the password."}, {"start": 20.8, "end": 28.3, "text": "Then posts the assignment: fix the accessibility problems on the landing page, with the page address in the details and a deadline."}, {"start": 29.7, "end": 33.0, "text": "The developer signs up and joins with the workspace code."}, {"start": 33.4, "end": 39.4, "text": "The assignment is waiting, with its details and deadline. Starting it opens the studio with the title filled in."}, {"start": 39.8, "end": 52.6, "text": "The developer pastes the page address. ENGANO opens it in a real browser, scrolls the whole page, tests the links, tries a phone-sized screen and measures accessibility. This takes a while, so we skip ahead."}, {"start": 52.7, "end": 59.8, "text": "The result is specific. Every problem says what is wrong and what must be fixed, and the page can't pass until it is."}, {"start": 60.5, "end": 66.4, "text": "The developer fixes the page and checks it again. Here a well-built public site stands in for the fixed page."}, {"start": 71.1, "end": 75.8, "text": "Now only a minor note remains, so the developer sends the check to the reviewer."}, {"start": 77.1, "end": 82.6, "text": "The reviewer sees the task and the page that was checked, with ENGANO's findings and their sources."}, {"start": 83.0, "end": 91.1, "text": "They look at the history, add a comment, and approve. If something were wrong they would reject with a note, and the developer would fix and resubmit."}, {"start": 92.5, "end": 94.6, "text": "The developer sees the work approved."}, {"start": 95.9, "end": 101.3, "text": "The manager finds it in approved drafts, with its full history, without having reviewed anything."}]}];
  const v = document.getElementById('v');
  const mmss = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  let chapterBtns = [], lines = [];
  function show(i) {
    const d = VIDEOS[i];
    document.getElementById('blurb').textContent = d.blurb + ' ' + mmss(d.duration) + ' long. Click a chapter or a line to jump there.';
    document.querySelectorAll('#switch button').forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)));
    v.poster = d.poster; v.src = d.video; v.load();
    const ul = document.getElementById('chapters'); ul.innerHTML = '';
    d.chapters.forEach((c) => { const li = document.createElement('li'); const b = document.createElement('button');
      b.dataset.t = c.start; b.innerHTML = '<span class="t">' + mmss(c.start) + '</span>'; b.append(c.title); li.append(b); ul.append(li); });
    const tr = document.getElementById('transcript'); tr.innerHTML = '';
    d.captions.forEach((c) => { const p = document.createElement('p'); p.dataset.t = c.start; p.dataset.e = c.end;
      const b = document.createElement('button'); b.dataset.t = c.start; b.textContent = mmss(c.start); p.append(b, ' ' + c.text); tr.append(p); });
    chapterBtns = [...ul.querySelectorAll('button')]; lines = [...tr.querySelectorAll('p')];
    document.querySelectorAll('[data-t]').forEach((el) => { if (el.tagName === 'BUTTON') el.onclick = () => { v.currentTime = parseFloat(el.dataset.t); v.play(); }; });
  }
  const sw = document.getElementById('switch');
  VIDEOS.forEach((d, i) => { const b = document.createElement('button'); b.textContent = d.title; b.onclick = () => show(i); sw.append(b); });
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime; let cur = -1;
    chapterBtns.forEach((b, i) => { if (parseFloat(b.dataset.t) <= t) cur = i; });
    chapterBtns.forEach((b, i) => b.classList.toggle('on', i === cur));
    lines.forEach((p) => p.classList.toggle('on', t >= parseFloat(p.dataset.t) && t < parseFloat(p.dataset.e)));
  });
  show(0);
</script>
</body>
</html>
